<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#1f153a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Border & Frame -->
  <rect width="900" height="600" fill="url(#cert-bg)"/>
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="url(#gold-grad)" stroke-width="3" rx="10"/>
  <rect x="35" y="35" width="830" height="530" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8 6" rx="8"/>

  <!-- Corner Ornaments -->
  <polygon points="35,35 65,35 35,65" fill="url(#gold-grad)"/>
  <polygon points="865,35 835,35 865,65" fill="url(#gold-grad)"/>
  <polygon points="35,565 65,565 35,535" fill="url(#gold-grad)"/>
  <polygon points="865,565 835,565 865,535" fill="url(#gold-grad)"/>

  <!-- Header -->
  <text x="450" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
  <line x1="330" y1="115" x2="570" y2="115" stroke="url(#gold-grad)" stroke-width="2"/>

  <!-- Presented to -->
  <text x="450" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">PROUDLY PRESENTED TO</text>
  <text x="450" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="1">Abhishek Singh Yadav</text>
  <line x1="260" y1="245" x2="640" y2="245" stroke="#475569" stroke-width="1"/>

  <!-- Reason / Course -->
  <text x="450" y="290" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">for successfully demonstrating competency in</text>
  <text x="450" y="340" fill="url(#violet-grad)" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">Fundamentals of Artificial Intelligence</text>

  <!-- Details -->
  <text x="450" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" max-width="600">Covering Machine Learning Taxonomies, Problem Formulation, Intelligent Agents &amp; Search Algorithms</text>

  <!-- Seal -->
  <g transform="translate(450, 480)">
    <circle cx="0" cy="0" r="45" fill="#1e1838" stroke="url(#gold-grad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="0" y="-8" fill="url(#gold-grad)" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AI</text>
    <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">ACCREDITED</text>
  </g>

  <!-- Signatures / Meta -->
  <g transform="translate(140, 490)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Program Director</text>
    <text x="90" y="35" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Technical Studies</text>
  </g>

  <g transform="translate(580, 490)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Academic Year</text>
    <text x="90" y="35" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">2024 • Verified Record</text>
  </g>
</svg>
