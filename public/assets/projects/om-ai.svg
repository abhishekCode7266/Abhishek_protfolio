<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="om-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#12182c"/>
      <stop offset="100%" stop-color="#1e1438"/>
    </linearGradient>
    <linearGradient id="om-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#om-bg)"/>
  
  <!-- Subtle glowing grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.12"/>
  </pattern>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>

  <!-- Window Header / Browser Chrome -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#0d111e" stroke="#2d3748" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="42" rx="12" fill="#151b2e"/>
  <!-- Window buttons -->
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
  <circle cx="70" cy="45" r="6" fill="#eab308"/>
  <circle cx="90" cy="45" r="6" fill="#22c55e"/>

  <!-- Tab Title -->
  <rect x="120" y="32" width="220" height="26" rx="6" fill="#0d111e"/>
  <text x="230" y="49" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">⚡ OM AI Action Assistant</text>

  <!-- URL Bar -->
  <rect x="360" y="34" width="390" height="22" rx="4" fill="#080c16"/>
  <text x="375" y="49" fill="#64748b" font-family="monospace" font-size="11">https://abhishekcode7266.github.io/OM-AI-Action-Assistant/</text>

  <!-- Content Split: Chat / Command Panel + Live Code Execution -->
  <!-- Left Side: Action Assistant Chat -->
  <rect x="44" y="86" width="340" height="370" rx="8" fill="#131929" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Assistant Header -->
  <circle cx="70" cy="115" r="14" fill="#8b5cf6"/>
  <text x="70" y="120" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">OM</text>
  <text x="96" y="115" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">OM Action Engine</text>
  <text x="96" y="129" fill="#10b981" font-family="sans-serif" font-size="11">● Ready for commands</text>

  <!-- Prompt Bubble 1 -->
  <rect x="60" y="145" width="260" height="48" rx="8" fill="#1e293b"/>
  <text x="74" y="166" fill="#cbd5e1" font-family="sans-serif" font-size="12">"Organize project files &amp; build</text>
  <text x="74" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="12">analytical summary dashboard."</text>

  <!-- Assistant Response Bubble -->
  <rect x="60" y="205" width="308" height="150" rx="8" fill="#1a1c32" stroke="#8b5cf6" stroke-width="1"/>
  <text x="74" y="226" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">ACTION EXECUTED:</text>
  <text x="74" y="248" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Parsed 1,420 data points</text>
  <text x="74" y="268" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Cleaned null values (99.8% conf)</text>
  <text x="74" y="288" fill="#e2e8f0" font-family="monospace" font-size="11">✓ Generated reactive metrics card</text>
  <text x="74" y="308" fill="#38bdf8" font-family="monospace" font-size="11">✓ Deployed static preview live</text>
  <rect x="74" y="324" width="130" height="22" rx="4" fill="#8b5cf6"/>
  <text x="139" y="339" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">View Output →</text>

  <!-- Chat Input Box -->
  <rect x="58" y="375" width="312" height="60" rx="8" fill="#0c101d" stroke="#2e3852" stroke-width="1"/>
  <text x="74" y="405" fill="#64748b" font-family="sans-serif" font-size="12">Type an action or prompt...</text>
  <circle cx="345" cy="405" r="14" fill="#6366f1"/>
  <path d="M341 405 L347 400 L347 410 Z" fill="#ffffff"/>

  <!-- Right Side: Code Editor Preview -->
  <rect x="404" y="86" width="352" height="370" rx="8" fill="#090d16" stroke="#1f293d" stroke-width="1"/>
  <rect x="404" y="86" width="352" height="32" rx="8" fill="#111726"/>
  <text x="424" y="106" fill="#94a3b8" font-family="monospace" font-size="11">assistant-core.ts</text>
  <rect x="720" y="96" width="24" height="12" rx="3" fill="#8b5cf6" opacity="0.3"/>

  <!-- Code lines -->
  <g font-family="monospace" font-size="12" line-height="1.6">
    <text x="424" y="145" fill="#f43f5e">export async function</text>
    <text x="590" y="145" fill="#38bdf8">executeTask</text>
    <text x="670" y="145" fill="#f8fafc">() {</text>

    <text x="440" y="175" fill="#64748b">// Initialize OM action agent</text>
    <text x="440" y="195" fill="#f43f5e">const</text>
    <text x="480" y="195" fill="#fbbf24">agent</text>
    <text x="525" y="195" fill="#f8fafc">=</text>
    <text x="540" y="195" fill="#38bdf8">new</text>
    <text x="570" y="195" fill="#a855f7">ActionAssistant</text>
    <text x="670" y="195" fill="#f8fafc">({</text>

    <text x="460" y="220" fill="#94a3b8">mode:</text>
    <text x="510" y="220" fill="#34d399">"autonomous"</text>
    <text x="610" y="220" fill="#f8fafc">,</text>

    <text x="460" y="245" fill="#94a3b8">speed:</text>
    <text x="515" y="245" fill="#38bdf8">"realtime"</text>
    <text x="595" y="245" fill="#f8fafc">,</text>

    <text x="460" y="270" fill="#94a3b8">accuracy:</text>
    <text x="540" y="270" fill="#f59e0b">0.99</text>

    <text x="440" y="295" fill="#f8fafc">});</text>

    <text x="440" y="330" fill="#f43f5e">await</text>
    <text x="485" y="330" fill="#fbbf24">agent</text>
    <text x="520" y="330" fill="#f8fafc">.</text>
    <text x="530" y="330" fill="#38bdf8">runWorkflow</text>
    <text x="615" y="330" fill="#f8fafc">();</text>

    <text x="440" y="360" fill="#a855f7">return</text>
    <text x="490" y="360" fill="#34d399">"Task complete ✓"</text>
    <text x="625" y="360" fill="#f8fafc">;</text>

    <text x="424" y="390" fill="#f8fafc">}</text>
  </g>

  <!-- Glowing indicator badge -->
  <g transform="translate(620, 420)">
    <rect width="120" height="26" rx="13" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#10b981"/>
    <text x="64" y="17" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">LIVE DEMO ON</text>
  </g>
</svg>
