<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#lp-bg)"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#0d1424" stroke="#253248" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="42" rx="12" fill="#152038"/>
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
  <circle cx="70" cy="45" r="6" fill="#eab308"/>
  <circle cx="90" cy="45" r="6" fill="#22c55e"/>
  <text x="400" y="49" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Building Learning Platform — Technical Curriculum &amp; Modules</text>

  <!-- Left: Course Navigation Tree -->
  <rect x="44" y="86" width="220" height="370" rx="8" fill="#10192e" stroke="#1d2a45" stroke-width="1"/>
  <text x="64" y="118" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">MODULE TRACKS</text>
  
  <rect x="54" y="136" width="200" height="34" rx="6" fill="#1a2744"/>
  <text x="68" y="157" fill="#60a5fa" font-family="sans-serif" font-size="12">1. Python Foundations ✓</text>
  
  <rect x="54" y="176" width="200" height="34" rx="6" fill="#1e293b"/>
  <text x="68" y="197" fill="#f8fafc" font-family="sans-serif" font-size="12">2. Data Structures &amp; OOP</text>
  
  <rect x="54" y="216" width="200" height="34" rx="6" fill="#131e33"/>
  <text x="68" y="237" fill="#94a3b8" font-family="sans-serif" font-size="12">3. Web DOM &amp; JavaScript</text>

  <rect x="54" y="256" width="200" height="34" rx="6" fill="#131e33"/>
  <text x="68" y="277" fill="#94a3b8" font-family="sans-serif" font-size="12">4. Pandas &amp; Analytics</text>

  <!-- Right: Active Tutorial & Interactive Code Editor -->
  <rect x="280" y="86" width="476" height="370" rx="8" fill="#090d16" stroke="#1c2538" stroke-width="1"/>
  
  <rect x="280" y="86" width="476" height="36" rx="8" fill="#111827"/>
  <text x="300" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Exercise: Array Filter &amp; Map Pipeline</text>
  <rect x="670" y="93" width="70" height="22" rx="4" fill="#10b981"/>
  <text x="705" y="108" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RUN CODE</text>

  <!-- Editor snippet -->
  <g font-family="monospace" font-size="12">
    <text x="300" y="150" fill="#64748b">// Clean and filter student scores &gt;= 75</text>
    <text x="300" y="175" fill="#f43f5e">const</text>
    <text x="345" y="175" fill="#fbbf24">students</text>
    <text x="410" y="175" fill="#f8fafc">=</text>
    <text x="425" y="175" fill="#cbd5e1">[</text>
    <text x="320" y="198" fill="#cbd5e1">{ name: "Abhishek", score: 92, status: "Pass" },</text>
    <text x="320" y="220" fill="#cbd5e1">{ name: "Priya", score: 88, status: "Pass" },</text>
    <text x="320" y="242" fill="#cbd5e1">{ name: "Rahul", score: 71, status: "Review" }</text>
    <text x="300" y="264" fill="#cbd5e1">];</text>

    <text x="300" y="300" fill="#f43f5e">const</text>
    <text x="345" y="300" fill="#fbbf24">topPerformers</text>
    <text x="445" y="300" fill="#f8fafc">=</text>
    <text x="460" y="300" fill="#fbbf24">students</text>
    <text x="320" y="325" fill="#38bdf8">.filter</text>
    <text x="370" y="325" fill="#cbd5e1">(s =&gt; s.score &gt;= 75)</text>
    <text x="320" y="350" fill="#38bdf8">.map</text>
    <text x="355" y="350" fill="#cbd5e1">(s =&gt; s.name);</text>

    <text x="300" y="390" fill="#a855f7">console</text>
    <text x="350" y="390" fill="#f8fafc">.</text>
    <text x="358" y="390" fill="#38bdf8">log</text>
    <text x="382" y="390" fill="#cbd5e1">(topPerformers);</text>
  </g>

  <!-- Terminal Output -->
  <rect x="296" y="415" width="444" height="30" rx="4" fill="#1e293b"/>
  <text x="310" y="434" fill="#34d399" font-family="monospace" font-size="11">&gt; Output: [ "Abhishek", "Priya" ] (Execution: 8ms)</text>
</svg>
