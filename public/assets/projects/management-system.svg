  <rect width="800" height="500" rx="16" fill="url(#ms-bg)"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#0d1322" stroke="#253248" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="42" rx="12" fill="#141c2e"/>
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
