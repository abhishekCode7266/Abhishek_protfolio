<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151b2e"/>
      <stop offset="100%" stop-color="#1f1635"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle with halo -->
  <rect width="400" height="400" rx="200" fill="url(#bg-grad)"/>
  <circle cx="200" cy="200" r="185" fill="url(#halo)"/>

  <!-- Futuristic glowing border ring -->
  <circle cx="200" cy="200" r="188" stroke="url(#glow-grad)" stroke-width="4" fill="none" opacity="0.85" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="176" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.6"/>

  <!-- Tech Grid Lines Behind Avatar -->
  <line x1="80" y1="200" x2="320" y2="200" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="80" x2="200" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.2"/>

  <!-- Modern Developer Silhouette / Geometry -->
  <g transform="translate(0, 10)">
    <!-- Shoulders -->
    <path d="M110 320 C110 260, 150 240, 200 240 C250 240, 290 260, 290 320 Z" fill="#1e2640" stroke="#6366f1" stroke-width="2"/>
    <path d="M130 320 C135 275, 165 255, 200 255 C235 255, 265 275, 270 320 Z" fill="#2b1b4d" opacity="0.8"/>

    <!-- Collar / Hoodie Accent -->
    <path d="M175 242 L200 270 L225 242 Z" fill="#8b5cf6" opacity="0.9"/>

    <!-- Head / Face silhouette -->
    <ellipse cx="200" cy="180" rx="52" ry="62" fill="#242c47" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Modern styled hair -->
    <path d="M148 165 C146 125, 175 110, 200 110 C225 110, 254 125, 252 165 C240 140, 220 135, 200 135 C175 135, 158 145, 148 165 Z" fill="#0d121f"/>

    <!-- Tech Glasses / AR Visor -->
    <rect x="160" y="165" width="34" height="20" rx="6" fill="#10172a" stroke="#a855f7" stroke-width="2"/>
    <rect x="206" y="165" width="34" height="20" rx="6" fill="#10172a" stroke="#a855f7" stroke-width="2"/>
    <line x1="194" y1="175" x2="206" y2="175" stroke="#a855f7" stroke-width="2"/>

    <!-- Subtle visor reflection glow -->
    <line x1="164" y1="170" x2="188" y2="170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="210" y1="170" x2="234" y2="170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ASY Badge Tag at bottom right -->
  <g transform="translate(250, 290)">
    <rect width="80" height="32" rx="16" fill="#0b0f19" stroke="#a855f7" stroke-width="2"/>
    <text x="40" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1.5">ASY</text>
  </g>

  <!-- Status Indicator Dot (Active/Available) -->
  <circle cx="100" cy="115" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="100" cy="115" r="12" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
